<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefly Swarm Meadow</title>
<meta name="description" content="A canvas firefly swarm wandering a dark meadow of layered grass silhouettes with soft glow sprites, blinking phases and out-of-focus foreground bokeh.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="meadow">
  <div class="sky"></div>
  <div class="stars stars--far"></div>
  <div class="stars stars--mid"></div>
  <div class="moon"></div>
  <div class="treeline treeline--far"></div>
  <div class="treeline treeline--near"></div>
  <div class="mist"></div>
  <canvas class="swarm" id="swarm"></canvas>
  <div class="grass grass--far"></div>
  <div class="grass grass--mid"></div>
  <canvas class="swarm swarm--front" id="swarm-front"></canvas>
  <div class="grass grass--near"></div>
  <div class="fore fore--a"></div>
  <div class="fore fore--b"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <p class="caption">Firefly Swarm Meadow</p>
</div>
</body>
</html>
