<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Particle Orbit Animation</title>
<meta name="description" content="Multiple orbiting particles around a glowing core in pure CSS.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="orbit-system">
  <div class="core"></div>
  <div class="orbit-ring r1"><div class="particle"></div></div><div class="orbit-ring r2"><div class="particle"></div></div><div class="orbit-ring r3"><div class="particle"></div></div><div class="orbit-ring r4"><div class="particle"></div></div><div class="orbit-ring r5"><div class="particle"></div></div><div class="orbit-ring r6"><div class="particle"></div></div>
</div>
</body>
</html>
