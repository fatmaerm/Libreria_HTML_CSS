<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mobius Infinity Loop</title>
<meta name="description" content="A morphing Mobius strip drawn by an animated dash reveal while a rotating lemniscate links through its loop.">
<meta name="description-es" content="Una cinta de Möbius que se deforma y se dibuja con una aparición animada del trazo, mientras una lemniscata giratoria se enlaza a través de su bucle.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="scene">
  <div class="field"></div>
  <div class="nebula nebula-a"></div>
  <div class="nebula nebula-b"></div>
  <div class="grid"></div>

  <div class="stage">
    <svg class="figure" id="mobius" viewBox="0 0 1000 640" role="img" aria-label="A Mobius strip that morphs and draws itself while an infinity loop rotates and links through it">
      <defs>
        <linearGradient id="silkGrad" gradientUnits="userSpaceOnUse" x1="120" y1="60" x2="880" y2="580" gradientTransform="rotate(18 500 320)">
          <stop offset="0" stop-color="#22d3ee"></stop>
          <stop offset=".26" stop-color="#5b8cf8"></stop>
          <stop offset=".52" stop-color="#a970f2"></stop>
          <stop offset=".78" stop-color="#f472b6"></stop>
          <stop offset="1" stop-color="#fbbf24"></stop>
        </linearGradient>
        <linearGradient id="loopGrad" gradientUnits="userSpaceOnUse" x1="330" y1="200" x2="670" y2="440" gradientTransform="rotate(18 500 320)">
          <stop offset="0" stop-color="#fbbf24"></stop>
          <stop offset=".5" stop-color="#fb7185"></stop>
          <stop offset="1" stop-color="#a78bfa"></stop>
        </linearGradient>
      </defs>

      <g id="lobeBack" class="lobe lobe-back"></g>
      <path id="body" class="body" fill="url(#silkGrad)" fill-rule="evenodd"></path>
      <path id="ribsMajor" class="ribs ribs-major"></path>
      <path id="ribsMinor" class="ribs ribs-minor"></path>
      <path id="edgeHalo" class="edge-halo" stroke="url(#silkGrad)"></path>
      <path id="edge" class="edge" stroke="url(#silkGrad)"></path>
      <path id="comet" class="comet" stroke="url(#silkGrad)"></path>
      <path id="spineHalo" class="spine-halo" stroke="url(#silkGrad)"></path>
      <path id="spine" class="spine" stroke="url(#silkGrad)"></path>
      <path id="reveal" class="reveal" stroke="url(#silkGrad)"></path>
      <g id="lobeFront" class="lobe lobe-front"></g>
    </svg>
  </div>

  <svg class="grain" viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true" focusable="false">
    <defs>
      <filter id="mobGrain">
        <feTurbulence type="fractalNoise" baseFrequency="0.87" numOctaves="2" stitchTiles="stitch"></feTurbulence>
        <feColorMatrix type="saturate" values="0"></feColorMatrix>
      </filter>
    </defs>
    <rect width="800" height="500" filter="url(#mobGrain)"></rect>
  </svg>

  <div class="vignette"></div>

  <header class="hud">
    <p class="eyebrow">Mobius / Infinity Loop</p>
    <p class="lede">A single twisted surface drawn by its own stroke, linked by a lemniscate turning through three dimensions.</p>
  </header>

  <section class="panel">
    <div class="row"><span class="k">Surface</span><span class="v">Mobius</span></div>
    <div class="row"><span class="k">Twist</span><span class="v">180&deg;</span></div>
    <div class="row"><span class="k">Link figure</span><span class="v">Lemniscate</span></div>
    <div class="row"><span class="k">Reveal</span><span class="v" id="revealOut">0%</span></div>
    <div class="meter"><i id="revealBar"></i></div>
    <div class="row"><span class="k">Bands</span><span class="v" id="bandOut">0 px</span></div>
  </section>

  <footer class="legend">
    <span class="hint">Drag to turn / double tap to reset</span>
    <span class="readout">parametric surface / dash reveal</span>
  </footer>
</main>
</body>
</html>
