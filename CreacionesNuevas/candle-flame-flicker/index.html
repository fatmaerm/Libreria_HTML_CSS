<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Candle Flame Flicker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="candle-scene" aria-label="Vela cálida encendida con llama titilante">
    <div class="ambient-glow"></div>
    <div class="candle-assembly">
      <div class="flame-wrap">
        <div class="flame">
          <div class="flame-inner"></div>
          <div class="flame-blue"></div>
        </div>
      </div>
      <div class="wick"></div>
      <div class="wax-pool"></div>
      <div class="candle-cylinder"></div>
    </div>
    <div class="candle-title">LUZ SERENA // LLAMA VIVA</div>
  </div>
</body>
</html>
