<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Knurled Aluminium Button</title>
<meta name="description" content="A column of three knurled aluminium keys each turning through twelve real detents, the diamond knurl crawling under a fixed light as every index lands on its notch.">
<meta name="description-es" content="Columna de tres teclas de aluminio moleteado, cada una que gira doce posiciones reales, con el moleteado de diamante reptando bajo una luz fija mientras cada índice encaja en su muesca.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="col">
  <span class="col__pool" aria-hidden="true"></span>
  <span class="col__rail" aria-hidden="true"></span>

  <button class="knob" id="k0" type="button" aria-label="Detent key one">
    <span class="knob__ring" aria-hidden="true"></span>
    <span class="knob__dial" aria-hidden="true">
      <i class="knob__grain"></i>
      <i class="knob__mark"></i>
    </span>
    <span class="knob__face" aria-hidden="true">
      <i class="knob__light"></i>
      <i class="knob__bevel"></i>
      <b class="knob__num">03</b>
      <s class="knob__notch"></s>
    </span>
  </button>

  <button class="knob knob--b" id="k1" type="button" aria-label="Detent key two">
    <span class="knob__ring" aria-hidden="true"></span>
    <span class="knob__dial" aria-hidden="true">
      <i class="knob__grain"></i>
      <i class="knob__mark"></i>
    </span>
    <span class="knob__face" aria-hidden="true">
      <i class="knob__light"></i>
      <i class="knob__bevel"></i>
      <b class="knob__num">07</b>
      <s class="knob__notch"></s>
    </span>
  </button>

  <button class="knob knob--c" id="k2" type="button" aria-label="Detent key three">
    <span class="knob__ring" aria-hidden="true"></span>
    <span class="knob__dial" aria-hidden="true">
      <i class="knob__grain"></i>
      <i class="knob__mark"></i>
    </span>
    <span class="knob__face" aria-hidden="true">
      <i class="knob__light"></i>
      <i class="knob__bevel"></i>
      <b class="knob__num">11</b>
      <s class="knob__notch"></s>
    </span>
  </button>
</main>
</body>
</html>
