<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Multi Theme Switcher</title>
<meta name="description" content="Multi-theme color switcher with CSS custom properties and smooth transition.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="theme-demo">
  <div class="theme-bar" id="themeBar">
    <button class="theme-btn active" data-theme="dark">🌑 Dark</button><button class="theme-btn" data-theme="light">☀️ Light</button><button class="theme-btn" data-theme="ocean">🌊 Ocean</button><button class="theme-btn" data-theme="forest">🌲 Forest</button><button class="theme-btn" data-theme="candy">🍭 Candy</button>
  </div>
  <div class="demo-card">
    <h2>Theme Preview</h2>
    <p>Watch colors change across the entire page.</p>
    <button class="demo-btn">Action Button</button>
  </div>
</div>
</body>
</html>
