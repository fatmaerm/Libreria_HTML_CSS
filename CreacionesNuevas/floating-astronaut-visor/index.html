<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floating Astronaut Visor</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="helmet-viewport" aria-label="Casco de astronauta en gravedad cero">
    <div class="helmet">
      <div class="helmet-shell">
        <div class="visor">
          <div class="visor-reflection"></div>
          <div class="visor-nebula"></div>
          <div class="hud-reticle"></div>
        </div>
        <div class="oxygen-vent vent-left"></div>
        <div class="oxygen-vent vent-right"></div>
      </div>
      <div class="neck-collar"></div>
    </div>
    <div class="helmet-caption">MÓDULO EXTRAVEHICULAR // EVA-01</div>
  </div>
</body>
</html>
