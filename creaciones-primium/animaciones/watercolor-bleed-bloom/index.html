<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watercolor Bleed Bloom</title>
<meta name="description" content="Pigment blooms soaking into cotton rag: a wet front spreading outward, a darker rim where pigment pools, granulation settling as the wash dries, all built from SVG turbulence and displacement filters in a staggered loop.">
<meta name="description-es" content="Flores de pigmento empapándose en papel de algodón: un frente húmedo que se extiende, un borde más oscuro donde el pigmento se acumula y una granulación que se asienta al secarse la aguada, todo construido con filtros de turbulencia y desplazamiento de SVG en un bucle escalonado.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wcMass" x="-32%" y="-32%" width="164%" height="164%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.008 0.012" numOctaves="3" seed="17" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="46" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.6"/>
    </filter>
    <filter id="wcRim" x="-38%" y="-38%" width="176%" height="176%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.028 0.04" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="30" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="0.5"/>
    </filter>
    <filter id="wcTooth" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.34 0.4" numOctaves="3" seed="41" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.37  0 0 0 0 0.28  0.8 0 0 0 -0.24"/>
    </filter>
    <filter id="wcWash" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0026 0.0042" numOctaves="2" seed="67" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.47  0 0 0 0 0.36  0 0 0 0.36 0"/>
    </filter>
    <filter id="wcFibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.76 0.9" numOctaves="2" seed="23" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="studio" aria-hidden="true">
  <div class="studio__key"></div>
  <div class="studio__rim"></div>
</div>

<main class="stage">

  <div class="caption">
    <p class="eyebrow">Pigment Study Number Four</p>
    <h1 class="title">Watercolor Bleed Bloom</h1>
    <p class="lede">Cold-press pigment soaking into 300&nbsp;gsm cotton rag</p>
    <ul class="spec">
      <li>feTurbulence fractal 0.008</li>
      <li>feDisplacementMap scale 46</li>
      <li>feGaussianBlur 1.6</li>
      <li>wet rim darkens as it dries</li>
      <li id="wetLabel">blooms wet 0</li>
    </ul>
    <p class="hint">Press and drag on the sheet to wet the paper</p>
  </div>

  <section class="sheet" aria-label="Watercolor blooms soaking into cotton rag paper">
    <div class="paper" aria-hidden="true"></div>
    <div class="laid" aria-hidden="true"></div>

    <div class="bloom-field" id="bloomField">
      <div class="veil" aria-hidden="true"><span class="veil-in"></span></div>
      <div class="bloom" data-dur="23" data-off="0" data-sq="1.04,0.94" data-rot="-14" style="--x:27%;--y:29%;--w:35%;--ar:1.06;--c1:rgba(72,94,150,.86);--c2:rgba(48,64,110,0);--c3:rgba(126,150,200,.5);--c4:rgba(126,150,200,0);--c5:rgba(44,58,100,.6);--c6:rgba(44,58,100,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="31" data-off="11.4" data-sq="0.92,1.08" data-rot="22" style="--x:60%;--y:20%;--w:23%;--ar:0.94;--c1:rgba(198,146,54,.88);--c2:rgba(158,110,32,0);--c3:rgba(230,192,120,.5);--c4:rgba(230,192,120,0);--c5:rgba(150,102,26,.6);--c6:rgba(150,102,26,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="27" data-off="6.2" data-sq="1.1,0.9" data-rot="-8" style="--x:73%;--y:54%;--w:31%;--ar:1.02;--c1:rgba(184,92,54,.88);--c2:rgba(146,66,42,0);--c3:rgba(216,148,104,.5);--c4:rgba(216,148,104,0);--c5:rgba(132,58,36,.62);--c6:rgba(132,58,36,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="25" data-off="17.9" data-sq="0.96,1.04" data-rot="34" style="--x:39%;--y:64%;--w:26%;--ar:1;--c1:rgba(170,72,66,.86);--c2:rgba(128,46,46,0);--c3:rgba(212,134,126,.48);--c4:rgba(212,134,126,0);--c5:rgba(118,40,44,.6);--c6:rgba(118,40,44,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="29" data-off="3.3" data-sq="1.08,0.92" data-rot="11" style="--x:17%;--y:70%;--w:20%;--ar:1.08;--c1:rgba(112,138,96,.84);--c2:rgba(80,102,68,0);--c3:rgba(160,184,138,.46);--c4:rgba(160,184,138,0);--c5:rgba(76,96,66,.58);--c6:rgba(76,96,66,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="21" data-off="14.6" data-sq="1.02,0.98" data-rot="-26" style="--x:88%;--y:24%;--w:14%;--ar:1.1;--c1:rgba(146,96,140,.8);--c2:rgba(104,62,104,0);--c3:rgba(190,152,186,.44);--c4:rgba(190,152,186,0);--c5:rgba(96,58,96,.56);--c6:rgba(96,58,96,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="19" data-off="9.1" data-sq="0.94,1.06" data-rot="18" style="--x:49%;--y:41%;--w:15%;--ar:0.96;--c1:rgba(196,110,66,.82);--c2:rgba(150,74,44,0);--c3:rgba(226,166,126,.44);--c4:rgba(226,166,126,0);--c5:rgba(146,72,44,.56);--c6:rgba(146,72,44,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>

      <div class="bloom" data-dur="33" data-off="21.7" data-sq="1.12,0.88" data-rot="-19" style="--x:30%;--y:88%;--w:13%;--ar:1.12;--c1:rgba(58,72,108,.8);--c2:rgba(38,48,78,0);--c3:rgba(110,132,178,.42);--c4:rgba(110,132,178,0);--c5:rgba(34,44,72,.56);--c6:rgba(34,44,72,0)">
        <span class="wet"></span>
        <span class="rim"><i></i></span>
        <span class="mass"><i></i></span>
        <span class="sed"></span>
        <span class="flick"><i></i></span>
      </div>
    </div>

    <div class="wash" aria-hidden="true"><svg><rect width="100%" height="100%" filter="url(#wcWash)"/></svg></div>
    <div class="tooth" aria-hidden="true"><svg><rect width="100%" height="100%" filter="url(#wcTooth)"/></svg></div>
    <div class="fibre" aria-hidden="true"><svg><rect width="100%" height="100%" filter="url(#wcFibre)"/></svg></div>
    <div class="glaze" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>
  </section>

</main>

</body>
</html>
