<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Board Energy Pulse</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="pcb-scene">
    <div class="pcb-chip">
      <span class="chip-label">AI CORE</span>
    </div>
    
    <!-- Pistas de circuito con pulsos de datos -->
    <div class="trace trace-top">
      <div class="pulse"></div>
    </div>
    <div class="trace trace-right">
      <div class="pulse"></div>
    </div>
    <div class="trace trace-bottom">
      <div class="pulse"></div>
    </div>
    <div class="trace trace-left">
      <div class="pulse"></div>
    </div>
    
    <div class="pcb-status">BUS DE DATOS // ENERGÍA ÓPTIMA</div>
  </div>
</body>
</html>
