<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Copy Code Success Burst</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="code-wrapper">
    <div class="code-topbar">
      <span class="file-name">install.sh</span>
      <button class="copy-btn" id="copyBtn" aria-label="Copiar código">
        <span class="btn-text">Copiar</span>
        <svg class="icon-copy" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <div class="code-body">
      <code>npm install @quantum/core --save-prod</code>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
