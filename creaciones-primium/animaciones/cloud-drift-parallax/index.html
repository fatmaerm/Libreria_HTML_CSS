<!doctype html>
<html lang="en">

<title>Cloud Drift Parallax</title>

</head>
<body>
<div class="sky">

  <div class="band band--cirrus"></div>

  <div class="band band--mid"></div>
  <div class="band band--low"></div>
  <div class="haze"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <p class="caption">Cloud Drift Parallax</p>
</div>
