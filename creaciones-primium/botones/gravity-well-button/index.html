<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gravity Well Assembly</title>
<meta name="description" content="An exploded technical view of a gravity-well button whose chassis, field lattice, membrane, event horizon and cap plate separate along leader lines and settle back into one pressable control.">
<meta name="description-es" content="Vista técnica despiezada de un botón de pozo gravitatorio: el chasis, la celosía de campo, la membrana, el horizonte de eventos y la tapa se separan siguiendo las líneas guía y vuelven a encajar en un único control pulsable.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="ex">
  <h1 class="ex__title">Gravity Well</h1>

  <div class="stack">
    <button class="btn" type="button" id="well">
      <span class="chassis">
        <i class="chassis__rim"></i>
        <i class="chassis__vents"></i>
      </span>
      <span class="led led--l led--0"><b class="cap"><i class="cap__n">01</i>Chassis</b></span>

      <span class="lay lay--1">
        <span class="plate plate--lattice"><i class="lattice"></i><i class="lattice__ring"></i></span>
        <span class="led led--l led--1"><b class="cap"><i class="cap__n">02</i>Field lattice</b></span>
      </span>

      <span class="lay lay--2">
        <span class="plate plate--membrane">
          <i class="membrane"></i>
          <i class="membrane__glint"></i>
          <i class="recoil"></i>
        </span>
        <span class="led led--r led--2"><b class="cap"><i class="cap__n">03</i>Membrane</b></span>
      </span>

      <span class="lay lay--3">
        <span class="plate plate--horizon">
          <i class="horizon"></i>
          <i class="horizon__ring"></i>
        </span>
        <span class="led led--l led--3"><b class="cap"><i class="cap__n">04</i>Event horizon</b></span>
      </span>

      <span class="lay lay--4">
        <span class="plate plate--cap">
          <i class="capface"></i>
          <i class="capface__type">Deploy</i>
        </span>
        <span class="led led--r led--4"><b class="cap"><i class="cap__n">05</i>Cap plate</b></span>
      </span>
    </button>
  </div>

  <div class="block">
    <span class="block__k">Fig. 03</span>
    <span class="block__v">Membrane assembly</span>
    <span class="block__k">Scale</span>
    <span class="block__v">4 : 1</span>
    <span class="block__k">Travel</span>
    <span class="block__v">4.0 mm</span>
  </div>
</main>
</body>
</html>
