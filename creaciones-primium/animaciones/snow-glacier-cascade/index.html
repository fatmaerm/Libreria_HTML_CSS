<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Snow Glacier Cascade</title>
<meta name="description" content="Four parallax layers of cascading snowfall drifting over a cold blue glacier wall and still meltwater lagoon in pure CSS.">
<meta name="description-es" content="Cuatro capas con paralaje de nieve cayendo sobre una pared de glaciar azul frío y una laguna inmóvil de agua de deshielo, hecho solo con CSS.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="glacier">
  <div class="sky"></div>
  <div class="stars"></div>
  <div class="moon"></div>
  <div class="peaks peaks--far"></div>
  <div class="peaks peaks--mid"></div>
  <div class="haze"></div>
  <div class="shelf"></div>
  <div class="lagoon"><span></span></div>
  <div class="snow snow--mist"><div class="fall fall--mist"></div></div>
  <div class="snow snow--mid"><div class="fall fall--mid"></div></div>
  <div class="snow snow--near"><div class="fall fall--near"></div></div>
  <div class="snow snow--bokeh"><div class="fall fall--bokeh"></div></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <p class="caption">Snow Glacier Cascade</p>
</div>
</body>
</html>
