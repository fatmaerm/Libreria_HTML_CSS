<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holographic Trading Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-wrap" id="cardWrap">
    <div class="holo-card" id="holoCard">
      <div class="card-foil"></div>
      <div class="card-glare"></div>
      <div class="card-content">
        <div class="card-header">
          <span class="rarity-badge">★ ULTRA RARE</span>
          <span class="hp-stat">HP 950</span>
        </div>
        <div class="card-art-box">
          <div class="art-sphere"></div>
          <div class="art-ring"></div>
        </div>
        <div class="card-info">
          <h2 class="creature-name">CHRONO DRAGON</h2>
          <p class="creature-type">Dragón de Plasma Temporal</p>
          <div class="attack-row">
            <span class="atk-name">SUPERNOVA BURST</span>
            <span class="atk-dmg">320</span>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
