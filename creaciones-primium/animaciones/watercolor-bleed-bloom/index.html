<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watercolor Bleed Bloom</title>
<meta name="description" content="Pigment washes bloom and bleed across cotton rag paper through SVG turbulence, displacement and blur filters in a staggered seamless loop.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wcBleed" x="-48%" y="-48%" width="196%" height="196%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.013" numOctaves="3" seed="17" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="72" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="2.1" result="soft"/>
      <feColorMatrix in="soft" type="matrix" values="1.16 0 0 0 -0.05  0 1.06 0 0 0.01  0 0 0.94 0 0.03  0 0 0 1.4 0" result="wet"/>
      <feBlend in="wet" in2="disp" mode="multiply"/>
    </filter>
    <filter id="wcLobe" x="-55%" y="-55%" width="210%" height="210%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.026" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="42" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.1"/>
    </filter>
    <filter id="wcFibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.82" numOctaves="2" seed="23" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.44" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="wcGran" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.07 0.062" numOctaves="3" seed="41" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.34  0 0 0 0 0.26  0 0 0 0 0.19  0 0 0 0.72 0"/>
    </filter>
    <filter id="wcWash" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.0022 0.0042" numOctaves="2" seed="67" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.44  0 0 0 0 0.34  0 0 0 0.3 0"/>
    </filter>
    <filter id="wcGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.94" numOctaves="2" seed="61" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.38" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="grain" aria-hidden="true">
  <svg><rect width="100%" height="100%" filter="url(#wcGrain)"/></svg>
</div>

<div class="studio" aria-hidden="true">
  <div class="studio__key"></div>
  <div class="studio__rim"></div>
</div>

<main class="stage">

  <div class="caption">
    <p class="eyebrow">Pigment Study Number Four</p>
    <h1 class="title">Watercolor Bleed Bloom</h1>
    <p class="lede">Cold-press pigment soaking into 300&nbsp;gsm cotton rag</p>
    <ul class="spec">
      <li>feTurbulence fractalNoise 0.009</li>
      <li>feDisplacementMap scale 72</li>
      <li>feGaussianBlur 2.1</li>
      <li>wet edge multiply accumulation</li>
    </ul>
    <p class="hint">Press and drag on the sheet to wet the paper</p>
  </div>

  <section class="sheet" aria-label="Watercolor blooms on cotton rag paper">
    <div class="paper" aria-hidden="true"></div>
    <div class="laid" aria-hidden="true"></div>

    <div class="bloom-field" id="bloomField">
      <div class="bloom" style="--x:20%;--y:27%;--size:38%;--c1:rgba(186,97,58,.95);--c2:rgba(150,71,50,0);--c3:rgba(214,140,96,.9);--c4:rgba(214,140,96,0);--c5:rgba(158,74,52,.85);--c6:rgba(158,74,52,0);--dur:19s;--delay:-2.4s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:53%;--y:20%;--size:28%;--c1:rgba(74,94,148,.88);--c2:rgba(52,68,112,0);--c3:rgba(126,146,196,.85);--c4:rgba(126,146,196,0);--c5:rgba(60,78,128,.8);--c6:rgba(60,78,128,0);--dur:24s;--delay:-9.1s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:74%;--y:45%;--size:32%;--c1:rgba(199,147,58,.92);--c2:rgba(160,113,36,0);--c3:rgba(226,186,112,.85);--c4:rgba(226,186,112,0);--c5:rgba(172,120,42,.82);--c6:rgba(172,120,42,0);--dur:21s;--delay:-14.6s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:37%;--y:63%;--size:26%;--c1:rgba(172,74,68,.9);--c2:rgba(131,50,50,0);--c3:rgba(214,132,124,.85);--c4:rgba(214,132,124,0);--c5:rgba(142,58,58,.8);--c6:rgba(142,58,58,0);--dur:26s;--delay:-5.3s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:62%;--y:79%;--size:22%;--c1:rgba(114,138,98,.9);--c2:rgba(84,106,71,0);--c3:rgba(160,182,138,.85);--c4:rgba(160,182,138,0);--c5:rgba(96,120,82,.8);--c6:rgba(96,120,82,0);--dur:17.5s;--delay:-11.8s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:12%;--y:73%;--size:18%;--c1:rgba(60,74,110,.82);--c2:rgba(41,52,80,0);--c3:rgba(112,132,178,.8);--c4:rgba(112,132,178,0);--c5:rgba(50,62,94,.76);--c6:rgba(50,62,94,0);--dur:29s;--delay:-19.2s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:45%;--y:42%;--size:15%;--c1:rgba(196,110,66,.85);--c2:rgba(154,78,46,0);--c3:rgba(224,164,124,.8);--c4:rgba(224,164,124,0);--c5:rgba(168,84,50,.78);--c6:rgba(168,84,50,0);--dur:31s;--delay:-23.4s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:84%;--y:23%;--size:14%;--c1:rgba(146,96,140,.82);--c2:rgba(108,66,108,0);--c3:rgba(190,152,186,.8);--c4:rgba(190,152,186,0);--c5:rgba(122,74,122,.78);--c6:rgba(122,74,122,0);--dur:33s;--delay:-27.7s"><span class="bloom-form"></span></div>
    </div>

    <div class="gran" aria-hidden="true">
      <svg><rect width="100%" height="100%" filter="url(#wcGran)"/></svg>
    </div>
    <div class="wash" aria-hidden="true">
      <svg><rect width="100%" height="100%" filter="url(#wcWash)"/></svg>
    </div>
    <div class="fibre" aria-hidden="true">
      <svg><rect width="100%" height="100%" filter="url(#wcFibre)"/></svg>
    </div>
    <div class="glaze" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>
  </section>

</main>

</body>
</html>
