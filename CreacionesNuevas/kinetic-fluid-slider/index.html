<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetic Fluid Slider</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="fluid-slider-box">
    <div class="slider-header">
      <span class="label">VOLUMEN BIÓNICO</span>
      <span class="value-display" id="valDisplay">65%</span>
    </div>
    <div class="slider-track" id="sliderTrack">
      <div class="track-fill" id="trackFill"></div>
      <div class="fluid-thumb" id="fluidThumb">
        <div class="thumb-glow"></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
