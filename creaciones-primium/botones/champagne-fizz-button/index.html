<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Champagne Fizz Button</title>
<meta name="description" content="A museum vitrine holds a champagne flute whose button face streams fine carbon threads upward until they swell and burst on the meniscus, erupting in foam when pressed.">
<meta name="description-es" content="Una vitrina de museo sostiene una copa de champán cuya cara de botón expulsa hilos finos de carbono hacia arriba hasta que se hinchan y estallan en el menisco, eructando espuma al pulsarla.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="gallery">
  <div class="wall" aria-hidden="true"></div>
  <div class="rail" aria-hidden="true"></div>
  <div class="cone cone--l" aria-hidden="true"></div>
  <div class="cone cone--r" aria-hidden="true"></div>
  <div class="floor" aria-hidden="true"><span class="floor__pool"></span><span class="floor__refl"></span></div>

  <header class="label">
    <span class="label__rule"></span>
    <h1 class="label__title">Champagne Fizz</h1>
    <span class="label__tag">Vitrine 14</span>
  </header>

  <div class="stage">
    <div class="case">
      <div class="case__deck">
        <div class="refl" aria-hidden="true"><span class="refl__txt"></span></div>
      </div>
      <div class="case__glow" aria-hidden="true"></div>

      <div class="flute">
        <button class="btn" type="button" id="pop">
          <span class="bubbles" aria-hidden="true"></span>
          <span class="meniscus" aria-hidden="true"></span>
          <span class="froth" aria-hidden="true"></span>
          <span class="btn__label">Pop</span>
          <span class="glint" aria-hidden="true"></span>
        </button>
        <span class="stem" aria-hidden="true"></span>
        <span class="foot" aria-hidden="true"></span>
      </div>

      <div class="plaque">
        <span class="plaque__a">Champagne Fizz</span>
        <span class="plaque__b">Carbon Dioxide Release</span>
        <span class="plaque__c">Bottle 014</span>
      </div>

      <span class="post post--tl"></span>
      <span class="post post--tr"></span>
      <span class="post post--bl"></span>
      <span class="post post--br"></span>
      <span class="bar bar--top"></span>
      <span class="bar bar--bot"></span>
      <span class="glass"></span>
      <span class="glass glass--sheen"></span>
    </div>

    <div class="plinth">
      <div class="plinth__lip"></div>
      <div class="plinth__body"></div>
      <div class="plinth__foot"></div>
    </div>
  </div>
</main>
</body>
</html>
