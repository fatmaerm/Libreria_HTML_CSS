<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CPU Core Load Matrix</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cpu-monitor">
    <div class="monitor-header">
      <span class="cpu-name">RYZEN 9 // 8 CORES</span>
      <span class="freq-tag">4.85 GHz</span>
    </div>
    <div class="core-grid" id="coreGrid">
      <div class="core-bar"><div class="fill" style="height:45%"></div><span>C1</span></div>
      <div class="core-bar"><div class="fill" style="height:78%"></div><span>C2</span></div>
      <div class="core-bar"><div class="fill" style="height:32%"></div><span>C3</span></div>
      <div class="core-bar"><div class="fill" style="height:92%"></div><span>C4</span></div>
      <div class="core-bar"><div class="fill" style="height:60%"></div><span>C5</span></div>
      <div class="core-bar"><div class="fill" style="height:25%"></div><span>C6</span></div>
      <div class="core-bar"><div class="fill" style="height:84%"></div><span>C7</span></div>
      <div class="core-bar"><div class="fill" style="height:55%"></div><span>C8</span></div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
