<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Filament Lightning</title>
<meta name="description" content="A charged filament trapped beneath the glass of one button whips after your pointer with real inertia and snaps into a discharge bolt with a scorch bloom wherever it lands.">
<meta name="description-es" content="Un filamento cargado atrapado bajo el cristal del botón se agita tras tu puntero con inercia real y salta en una descarga con un resplandor de quemadura allí donde aterriza.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<button class="coil" type="button" id="arc">
  <span class="coil__rail"></span>
  <span class="coil__ghost" id="ghost"></span>
  <span class="coil__whip" id="whip"></span>
  <span class="coil__head" id="head"></span>
  <span class="coil__halo" id="halo"></span>
  <span class="coil__sheen"></span>
  <span class="coil__marks"><span class="coil__kv">14.2 kV</span></span>
  <span class="coil__label">Ignite</span>
  <span class="coil__meter"><span class="coil__fill" id="fill"></span></span>
  <span class="coil__fx" id="fx"></span>
</button>
</body>
</html>
