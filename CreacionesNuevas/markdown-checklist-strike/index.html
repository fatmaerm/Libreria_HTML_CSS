<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Checklist Strike</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="task-card">
    <div class="task-header">
      <span class="task-title">RELEASE SPRINT // V2.0</span>
      <span class="progress-pct" id="progressPct">2 / 3</span>
    </div>
    <div class="task-list">
      <label class="task-item checked">
        <input type="checkbox" checked>
        <span class="checkmark">✓</span>
        <span class="task-text">Optimizar bundle con compresión Brotli</span>
      </label>
      <label class="task-item checked">
        <input type="checkbox" checked>
        <span class="checkmark">✓</span>
        <span class="task-text">Migrar endpoints REST a WebSockets</span>
      </label>
      <label class="task-item">
        <input type="checkbox">
        <span class="checkmark">✓</span>
        <span class="task-text">Validación de accesibilidad WCAG AAA</span>
      </label>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
