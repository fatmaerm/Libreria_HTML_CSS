<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sumi Ink Brush Stroke</title>
<meta name="description" content="A single pine-soot sumi-e pass on hand-torn kozo washi: a tapered ink ribbon revealed by a dash-offset wipe, with capillary bleed, pigment granulation, a pooled blot with wicking tendrils and a dry-brush tail.">
<meta name="description-es" content="Una sola pasada de tinta sumi-e de humo de pino sobre washi de kozo rasgado a mano: una cinta de tinta que se afina y aparece con un barrido del trazo, con sangrado capilar, granulación del pigmento, un charco con tentáculos que absorben la tinta y un final de pincel seco.">

<script defer src="script.js"></script>
