<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cryo Freeze Lock</title>
<meta name="description" content="A terminal runs a cryo lock command, frost creeps across the screen until the line is sealed, and each press shatters the lattice before it freezes over again.">
<meta name="description-es" content="Una terminal ejecuta un comando de bloqueo criogénico: la escarcha avanza por la pantalla hasta sellar la línea, y cada pulsación rompe la retícula cristalina antes de volver a congelarse.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="room">
  <div class="term">
    <div class="term__bar">
      <span class="dot d1"></span><span class="dot d2"></span><span class="dot d3"></span>
      <span class="term__t">cryoctl &mdash; /dev/line7 &mdash; 80x24</span>
      <span class="term__r" id="clock">00:00:00</span>
    </div>
    <div class="term__body">
      <div class="log" id="log"></div>
      <div class="line" id="line">
        <span class="line__p">&gt;</span>
        <span class="line__cmd" id="cmd">cryo-lock --line 7 --seal</span>
        <span class="caret"></span>
      </div>
      <div class="gauge">
        <span class="gauge__l">LATTICE</span>
        <i class="gauge__b"><u id="lat"></u></i>
        <span class="gauge__v" id="latv">0%</span>
      </div>
      <canvas id="frost" aria-hidden="true"></canvas>
      <div class="veil" id="veil"></div>
      <div class="lockbadge" id="badge"><span class="lockbadge__i"></span><span class="lockbadge__t">LINE SEALED</span></div>
      <div class="shards" id="shards"></div>
      <div class="scan"></div>
      <div class="glass"></div>
    </div>
    <div class="term__foot">
      <button class="key" id="key" type="button" aria-label="Run cryo lock">
        <span class="key__bez"></span>
        <span class="key__cap"><span class="key__label">RUN</span><span class="key__sub">CRYO-LOCK</span></span>
        <span class="key__led"></span>
      </button>
      <span class="foot__t">F7 &middot; cryo-lock &middot; F2 &middot; thaw</span>
      <span class="foot__s" id="stat">IDLE</span>
    </div>
  </div>
  <h1>Cryo Freeze Lock</h1>
  <p class="lede">Frost creeps across the glass until the line is sealed solid. Run the command again and the lattice shatters before it re-freezes.</p>
</main>
</body>
</html>
