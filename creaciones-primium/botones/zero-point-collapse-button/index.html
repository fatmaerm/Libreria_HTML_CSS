<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zero Point Collapse Button</title>
<meta name="description" content="Three identical controls stand in a row running the same collapse: on every beat each label is drawn down its own singularity axis into a point and released with a snap.">
<meta name="description-es" content="Tres controles idénticos en fila ejecutan el mismo colapso: en cada pulso, cada etiqueta es arrastrada por su propio eje de singularidad hasta un punto y se libera de golpe.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="row">
  <button class="zp" type="button" aria-label="Collapse">
    <span class="zp__well" aria-hidden="true"></span>
    <span class="zp__plate" aria-hidden="true"></span>
    <span class="zp__idx" aria-hidden="true">I</span>
    <span class="zp__label" aria-hidden="true">Collapse</span>
    <span class="zp__rho" aria-hidden="true">ρ 0.000</span>
    <span class="zp__brk" aria-hidden="true"></span>
  </button>
  <button class="zp" type="button" aria-label="Implode">
    <span class="zp__well" aria-hidden="true"></span>
    <span class="zp__plate" aria-hidden="true"></span>
    <span class="zp__idx" aria-hidden="true">II</span>
    <span class="zp__label" aria-hidden="true">Implode</span>
    <span class="zp__rho" aria-hidden="true">ρ 0.000</span>
    <span class="zp__brk" aria-hidden="true"></span>
  </button>
  <button class="zp" type="button" aria-label="Horizon">
    <span class="zp__well" aria-hidden="true"></span>
    <span class="zp__plate" aria-hidden="true"></span>
    <span class="zp__idx" aria-hidden="true">III</span>
    <span class="zp__label" aria-hidden="true">Horizon</span>
    <span class="zp__rho" aria-hidden="true">ρ 0.000</span>
    <span class="zp__brk" aria-hidden="true"></span>
  </button>
</main>
</body>
</html>
