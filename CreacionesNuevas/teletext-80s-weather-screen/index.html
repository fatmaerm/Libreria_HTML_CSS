<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teletext 80s Weather Screen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="teletext-card">
    <div class="tt-header">P101 CEEFAX 101 DOM 26 SEP</div>
    <div class="tt-title">CLIMA NACIONAL</div>
    <div class="tt-body">
      <div class="row"><span class="c-cyan">CIUDAD</span><span class="c-yellow">ESTADO</span><span class="c-green">TEMP</span></div>
      <div class="row"><span>MADRID</span><span>DESPEJADO</span><span>24°C</span></div>
      <div class="row"><span>LONDRES</span><span>LLUVIA</span><span>16°C</span></div>
      <div class="row"><span>BERLÍN</span><span>NUBLADO</span><span>18°C</span></div>
    </div>
  </div>
</body>
</html>
