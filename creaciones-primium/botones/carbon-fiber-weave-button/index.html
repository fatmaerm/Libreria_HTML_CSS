<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carbon Fibre Weave Button</title>
<meta name="description" content="An exploded technical view of a four-ply two-by-two twill carbon laminate whose plies separate on leader lines, catch resin sheen along the fibres and close back into a solid button face.">
<meta name="description-es" content="Una vista técnica explosionada de un laminado de fibra de carbono sarga 2x2 de cuatro capas, cuyas capas se separan siguiendo líneas de referencia, brillan con el brillo de la resina a lo largo de las fibras y vuelven a cerrarse en una cara de botón sólida.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <h1>Carbon 2&times;2 Twill &middot; Exploded</h1>

  <section class="view" id="view">
    <span class="view__floor" aria-hidden="true"></span>
    <span class="view__axis" aria-hidden="true"></span>

    <div class="leader" id="l0"><i></i><b>01 clear coat</b><s>0.10 mm</s></div>
    <div class="leader" id="l1"><i></i><b>02 warp 0&deg;</b><s>0.25 mm</s></div>
    <div class="leader" id="l2"><i></i><b>03 weft 90&deg;</b><s>0.25 mm</s></div>
    <div class="leader" id="l3"><i></i><b>04 warp 0&deg;</b><s>0.25 mm</s></div>
    <div class="leader" id="l4"><i></i><b>05 weft 90&deg;</b><s>0.25 mm</s></div>

    <button class="stack" id="stack" type="button" aria-label="Reassemble the carbon laminate">
      <span class="ply ply--w1" aria-hidden="true">
        <i class="tow"></i><i class="cross"></i><i class="shade"></i><i class="sheen"></i>
      </span>
      <span class="ply ply--f1" aria-hidden="true">
        <i class="tow"></i><i class="cross"></i><i class="shade"></i><i class="sheen"></i>
      </span>
      <span class="ply ply--w2" aria-hidden="true">
        <i class="tow"></i><i class="cross"></i><i class="shade"></i><i class="sheen"></i>
      </span>
      <span class="ply ply--f2" aria-hidden="true">
        <i class="tow"></i><i class="cross"></i><i class="shade"></i><i class="sheen"></i>
      </span>
      <span class="coat" aria-hidden="true">
        <i class="coat__weave"></i>
        <i class="coat__cross"></i>
        <i class="coat__shade"></i>
        <i class="coat__resin"></i>
        <i class="coat__gloss"></i>
        <b class="legend"><em>2 &times; 2 twill</em><i>4-ply laminate</i></b>
      </span>
    </button>
  </section>
</main>
</body>
</html>
