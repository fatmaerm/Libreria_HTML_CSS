<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DNA Helix Loader</title>
<meta name="description" content="Pure CSS double-helix DNA strand loading animation.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="scene">
  <div class="helix">
    <div class="pair" style="--i:0"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:1"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:2"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:3"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:4"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:5"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:6"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:7"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:8"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:9"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:10"><span class="dot a"></span><span class="dot b"></span></div>
    <div class="pair" style="--i:11"><span class="dot a"></span><span class="dot b"></span></div>
  </div>
</div>
</body>
</html>
