<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Shield Passcode Keypad</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="keypad-card">
    <div class="code-dots" id="dotsRow">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span>
    </div>
    <div class="keys-grid">
      <button class="key">1</button><button class="key">2</button><button class="key">3</button>
      <button class="key">4</button><button class="key">5</button><button class="key">6</button>
      <button class="key">7</button><button class="key">8</button><button class="key">9</button>
      <button class="key clear" id="clearBtn">C</button><button class="key">0</button><button class="key enter" id="enterBtn">↵</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
