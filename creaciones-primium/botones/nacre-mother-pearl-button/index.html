<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nacre Mother Of Pearl Button</title>
<meta name="description" content="Three mother-of-pearl plates in a row, each built from a different iridescent layer structure that drifts in hue and sends a ripple through its nacre layers when pressed.">
<meta name="description-es" content="Tres placas de madre perla en fila, cada una con una estructura de capas iridiscentes distinta cuyo tono deriva y que, al pulsarse, envía una ondulación a través de sus capas de nácar.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="row">
  <span class="row__wash" aria-hidden="true"></span>

  <button class="nacre nacre--a" type="button" aria-label="Banded nacre plate">
    <span class="nacre__face" aria-hidden="true">
      <i class="lay l1"></i><i class="lay l2"></i><i class="lay l3"></i><i class="lay l4"></i><i class="lay l5"></i>
      <i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i><i class="ripple r4"></i><i class="ripple r5"></i>
      <i class="nacre__gloss"></i>
      <b class="nacre__label">Aurora</b>
    </span>
  </button>

  <button class="nacre nacre--b" type="button" aria-label="Organic nacre plate">
    <span class="nacre__face" aria-hidden="true">
      <i class="lay l1"></i><i class="lay l2"></i><i class="lay l3"></i><i class="lay l4"></i><i class="lay l5"></i>
      <i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i><i class="ripple r4"></i><i class="ripple r5"></i>
      <i class="nacre__gloss"></i>
      <b class="nacre__label">Prism</b>
    </span>
  </button>

  <button class="nacre nacre--c" type="button" aria-label="Swirled nacre plate">
    <span class="nacre__face" aria-hidden="true">
      <i class="lay l1"></i><i class="lay l2"></i><i class="lay l3"></i><i class="lay l4"></i><i class="lay l5"></i>
      <i class="ripple r1"></i><i class="ripple r2"></i><i class="ripple r3"></i><i class="ripple r4"></i><i class="ripple r5"></i>
      <i class="nacre__gloss"></i>
      <b class="nacre__label">Lustre</b>
    </span>
  </button>
</main>
</body>
</html>
