<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morphing Blob Avatar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="avatar-card">
    <div class="blob-frame">
      <div class="blob-aura"></div>
      <div class="blob-shape">
        <div class="avatar-portrait">
          <svg viewBox="0 0 100 100" class="portrait-svg">
            <circle cx="50" cy="38" r="20" fill="#f8fafc" opacity="0.9" />
            <path d="M 20 85 C 20 65, 35 58, 50 58 C 65 58, 80 65, 80 85 Z" fill="#f8fafc" opacity="0.9" />
          </svg>
        </div>
      </div>
      <div class="status-indicator" title="En línea"></div>
    </div>
    
    <div class="avatar-bio">
      <h3>ALYA VEX</h3>
      <span class="role">Directora Creativa // 3D</span>
    </div>
  </div>
</body>
</html>
