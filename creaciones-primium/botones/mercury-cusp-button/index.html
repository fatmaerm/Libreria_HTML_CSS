<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mercury Cusp</title>
<meta name="description" content="A liquid metal meniscus climbs the face of a museum specimen button while a bright specular cusp rides the surface and the engraved label warps in the reflection.">
<meta name="description-es" content="Un menisco de metal líquido trepa por la cara de un botón de especimen de museo, mientras una cúspide especular brillante recorre la superficie y el rótulo grabado se deforma en el reflejo.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body class="ph0">
<main class="gal">
  <div class="wall"></div>
  <div class="ghost ghost--l"></div>
  <div class="ghost ghost--r"></div>
  <div class="seam"></div>
  <div class="beam"></div>
  <div class="beam2"></div>
  <div class="floor">
    <span class="tile t1"></span>
    <span class="tile t2"></span>
    <span class="tile t3"></span>
    <div class="pool"></div>
    <div class="shadow"></div>
    <div class="vitrine">
      <div class="case">
        <span class="case__post p1"></span>
        <span class="case__post p2"></span>
        <span class="case__post p3"></span>
        <span class="case__post p4"></span>
        <span class="case__rail"></span>
        <div class="ped">
          <div class="ped__stem"></div>
          <div class="ped__top"></div>
          <button class="btn" type="button" aria-label="Specimen button">
            <span class="face__plate"></span>
            <span class="face__engrave">SPECIMEN</span>
            <span class="face__label">CUSP</span>
            <span class="face__rule"></span>
            <span class="mercury">
              <span class="mirror">CUSP</span>
              <span class="mirror2">SPECIMEN</span>
              <span class="wave w1"></span>
              <span class="wave w2"></span>
            </span>
            <span class="crestline"></span>
            <span class="cusp"><i></i></span>
            <span class="gloss"></span>
          </button>
        </div>
        <div class="refl">
          <span class="refl__plate"></span>
          <span class="refl__mercury"></span>
        </div>
        <span class="streak s1"></span>
        <span class="streak s2"></span>
        <span class="streak s3"></span>
      </div>
      <div class="plaque">
        <span class="plaque__top">GALLERY NINE</span>
        <span class="plaque__rule"></span>
        <span class="plaque__l1">Element 80</span>
        <span class="plaque__l2">Liquid metal interface</span>
        <span class="plaque__l3">Cast alloy, mercury core</span>
        <span class="plaque__l4">Accession 1954.114</span>
      </div>
    </div>
    <div class="motes" aria-hidden="true">
      <i style="--x:16%;--y:8%;--d:0s"></i>
      <i style="--x:29%;--y:18%;--d:-7s"></i>
      <i style="--x:44%;--y:6%;--d:-13s"></i>
      <i style="--x:57%;--y:16%;--d:-4s"></i>
      <i style="--x:71%;--y:9%;--d:-18s"></i>
      <i style="--x:84%;--y:20%;--d:-9s"></i>
    </div>
  </div>
  <h1>Mercury Cusp</h1>
  <div class="vent"></div>
</main>
</body>
</html>
