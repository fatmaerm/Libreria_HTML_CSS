<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pulsing Sonar Radar</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sonar-wrapper">
    <div class="radar-scope" aria-label="Pantalla de radar táctico">
      <div class="ring ring-1"></div>
      <div class="ring ring-2"></div>
      <div class="ring ring-3"></div>
      <div class="ring ring-4"></div>
      <div class="axis axis-x"></div>
      <div class="axis axis-y"></div>
      <div class="sweep-beam"></div>
      
      <div class="blip blip-1" style="top: 28%; left: 66%;"></div>
      <div class="blip blip-2" style="top: 72%; left: 34%;"></div>
      <div class="blip blip-3" style="top: 22%; left: 30%;"></div>
      
      <div class="scope-hub"></div>
      <div class="radar-info">
        <span class="tag">SONAR DEEP // 45kHz</span>
        <span class="coords">ECOS ACTIVOS: 3</span>
      </div>
    </div>
  </div>
</body>
</html>
