<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Obsidian Polish Button</title>
<meta name="description" content="An obsidian slab under glass in a display case, polished to a mirror so its label reflects inverted in the stone while a specular sweep reveals the depth of the black.">
<meta name="description-es" content="Una losa de obsidiana bajo cristal, en una vitrina, pulida hasta quedar como espejo: su rótulo se refleja invertido en la piedra mientras un barrido especular revela la profundidad del negro.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="page">
  <h1>Vitrine 07 &middot; Obsidian Slab</h1>

  <section class="case">
    <span class="case__room" aria-hidden="true"></span>
    <span class="case__cone" aria-hidden="true"></span>
    <span class="case__pool" aria-hidden="true"></span>
    <span class="case__floor" aria-hidden="true"></span>

    <span class="case__post case__post--tl" aria-hidden="true"></span>
    <span class="case__post case__post--tr" aria-hidden="true"></span>
    <span class="case__post case__post--bl" aria-hidden="true"></span>
    <span class="case__post case__post--br" aria-hidden="true"></span>

    <div class="plinth">
      <span class="plinth__top" aria-hidden="true"></span>
      <span class="plinth__face" aria-hidden="true"></span>
      <span class="plinth__shadow" aria-hidden="true"></span>

      <button class="slab" id="slab" type="button" aria-label="The obsidian slab">
        <span class="slab__body" aria-hidden="true">
          <i class="slab__depth"></i>
          <i class="slab__sheen"></i>
          <i class="slab__spec"></i>
          <i class="slab__edge"></i>
          <b class="slab__label">Obsidian</b>
          <b class="slab__refl">Obsidian</b>
        </span>
      </button>

      <div class="plaque">
        <b>Obsidian &middot; mirror polish</b>
        <s>lava glass &middot; conchoidal fracture &middot; 18&nbsp;mm</s>
      </div>
    </div>

    <span class="case__glass" aria-hidden="true"></span>
    <span class="case__glare" aria-hidden="true"></span>
  </section>
</main>
</body>
</html>
