<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quantum Qubit Bloch Sphere</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="bloch-container">
    <div class="bloch-sphere">
      <div class="pole pole-zero">|0⟩</div>
      <div class="ring-lat"></div>
      <div class="ring-lon"></div>
      <div class="state-vector">
        <div class="vector-arrow"></div>
      </div>
      <div class="pole pole-one">|1⟩</div>
    </div>
    <div class="bloch-tag">ESFERA DE BLOCH // QUBIT ψ</div>
  </div>
</body>
</html>
