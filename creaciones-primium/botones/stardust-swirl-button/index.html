<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stardust Swirl</title>
<meta name="description" content="A single lacquered button orbited by stardust that settles into a fine glittering dusting on its face, catches the light and then lifts off again.">
<meta name="description-es" content="Un único pulsador lacado, orbitado por polvo de estrellas que se posa como una fina capa de destellos sobre su cara, capta la luz y vuelve a levantarse.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<main class="void">
  <button class="disc" id="disc" type="button" aria-label="Stardust">
    <i class="disc__halo"></i>
    <i class="disc__body">
      <i class="disc__rim"></i>
      <i class="disc__sheen"></i>
      <i class="disc__grain"></i>
      <em class="disc__mark"></em>
      <span class="disc__label">Stardust</span>
    </i>
    <i class="disc__pulse" id="pulse"></i>
  </button>
  <canvas class="dust" id="dust"></canvas>
</main>
</body>
</html>
