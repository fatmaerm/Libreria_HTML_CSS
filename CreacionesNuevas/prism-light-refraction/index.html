<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prism Light Refraction</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="prism-scene" aria-label="Refracción de haz de luz blanca a través de un prisma">
    <div class="laser-beam white-beam"></div>
    <div class="glass-prism">
      <div class="prism-internal-glow"></div>
    </div>
    <div class="rainbow-beam">
      <div class="spectrum-band band-red"></div>
      <div class="spectrum-band band-orange"></div>
      <div class="spectrum-band band-yellow"></div>
      <div class="spectrum-band band-green"></div>
      <div class="spectrum-band band-cyan"></div>
      <div class="spectrum-band band-blue"></div>
      <div class="spectrum-band band-violet"></div>
    </div>
    <div class="prism-title">DISPERSIÓN ÓPTICA // ESPECTRO VISIBLE</div>
  </div>
</body>
</html>
