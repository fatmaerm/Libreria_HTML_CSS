<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analog CRT Oscilloscope</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="oscilloscope-frame">
    <div class="screen-housing">
      <div class="crt-overlay"></div>
      <div class="graticule-grid"></div>
      <canvas id="scopeCanvas" width="360" height="240"></canvas>
    </div>
    
    <div class="control-panel">
      <span class="brand-tag">TEKTRONIX // LAB-6000</span>
      <div class="btn-group">
        <button class="mode-btn active" data-mode="sine">SENOIDAL</button>
        <button class="mode-btn" data-mode="lissajous">LISSAJOUS</button>
        <button class="mode-btn" data-mode="square">MODULADA</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
