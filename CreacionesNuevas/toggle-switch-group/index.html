<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Toggle Switch Group</title>
<meta name="description" content="Grouped settings panel with multiple toggle switches.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="settings-panel">
  <h3>Settings</h3>
  <div class="setting-row"><div class="setting-info"><span class="setting-icon">🔔</span><span>Notifications</span></div><label class="tog"><input type="checkbox" checked><div class="tog-track"><div class="tog-thumb"></div></div></label></div><div class="setting-row"><div class="setting-info"><span class="setting-icon">📊</span><span>Analytics</span></div><label class="tog"><input type="checkbox" ><div class="tog-track"><div class="tog-thumb"></div></div></label></div><div class="setting-row"><div class="setting-info"><span class="setting-icon">🌙</span><span>Dark mode</span></div><label class="tog"><input type="checkbox" checked><div class="tog-track"><div class="tog-thumb"></div></div></label></div><div class="setting-row"><div class="setting-info"><span class="setting-icon">🧪</span><span>Beta features</span></div><label class="tog"><input type="checkbox" ><div class="tog-track"><div class="tog-thumb"></div></div></label></div><div class="setting-row"><div class="setting-info"><span class="setting-icon">☁️</span><span>Cloud sync</span></div><label class="tog"><input type="checkbox" checked><div class="tog-track"><div class="tog-thumb"></div></div></label></div>
</div>
</body>
</html>
