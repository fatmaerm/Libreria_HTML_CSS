<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liquid Hourglass Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hourglass-wrap">
    <div class="cap top-cap"></div>
    <div class="glass-chamber">
      <div class="bulb top-bulb">
        <div class="liquid-top"></div>
      </div>
      
      <div class="neck">
        <div class="stream-line"></div>
        <div class="drip drip-1"></div>
        <div class="drip drip-2"></div>
      </div>
      
      <div class="bulb bottom-bulb">
        <div class="liquid-bottom"></div>
      </div>
    </div>
    <div class="cap bottom-cap"></div>
  </div>
</body>
</html>
