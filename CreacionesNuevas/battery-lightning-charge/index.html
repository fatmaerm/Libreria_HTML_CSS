<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battery Lightning Charge</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="battery-scene">
    <div class="battery-terminal"></div>
    <div class="battery-casing">
      <div class="liquid-charge">
        <div class="bubbles">
          <span></span><span></span><span></span><span></span>
        </div>
      </div>
      <div class="lightning-icon">
        <svg viewBox="0 0 24 24" width="40" height="40" fill="#ffffff">
          <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
        </svg>
      </div>
    </div>
    <div class="battery-stats">
      <span class="stat-pct">98% CARGANDO</span>
      <span class="stat-volt">4.2V // SUPERCARGA</span>
    </div>
  </div>
</body>
</html>
