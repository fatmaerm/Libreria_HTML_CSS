<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wind Swept Grass Field</title>
<meta name="description" content="A canvas grass field where thousands of blades bend under traveling wind waves and rolling gust fronts that cross the whole scene.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="field">
  <div class="sky"></div>
  <div class="sun"></div>
  <div class="hills hills--far"></div>
  <div class="hills hills--mid"></div>
  <div class="hills hills--near"></div>
  <div class="haze"></div>
  <div class="bank"></div>
  <canvas class="blades" id="field"></canvas>
  <div class="vignette"></div>
  <div class="grain"></div>
  <p class="caption">Wind Swept Grass Field</p>
</div>
</body>
</html>
