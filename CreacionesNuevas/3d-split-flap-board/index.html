<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Split Flap Board</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="board-frame">
    <div class="board-header">
      <span class="hub-label">AEROPUERTO METROPOLITANO // SALIDAS</span>
      <span class="live-dot"></span>
    </div>
    
    <div class="flap-row">
      <div class="flap-cell" id="dest">PARIS</div>
      <div class="flap-cell cell-gate" id="gate">G-08</div>
      <div class="flap-cell cell-status" id="status">EMBARQUE</div>
    </div>

    <button class="next-btn" id="nextFlightBtn">Siguiente vuelo</button>
  </div>
  <script src="script.js"></script>
</body>
</html>
