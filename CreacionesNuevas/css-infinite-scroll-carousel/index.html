<!doctype html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CSS Infinite Scroll Carousel</title>
<meta name="description" content="Pure CSS infinite looping horizontal carousel with pause on hover.">
<link rel="stylesheet" href="styles.css">

    <div class="scroll-card" aria-hidden="true"><span>React</span></div><div class="scroll-card" aria-hidden="true"><span>Vue</span></div><div class="scroll-card" aria-hidden="true"><span>Angular</span></div><div class="scroll-card" aria-hidden="true"><span>Svelte</span></div><div class="scroll-card" aria-hidden="true"><span>Next.js</span></div><div class="scroll-card" aria-hidden="true"><span>Nuxt</span></div><div class="scroll-card" aria-hidden="true"><span>Remix</span></div><div class="scroll-card" aria-hidden="true"><span>Astro</span></div><div class="scroll-card" aria-hidden="true"><span>SolidJS</span></div><div class="scroll-card" aria-hidden="true"><span>Qwik</span></div>
  </div>
</div>
</body>
</html>
