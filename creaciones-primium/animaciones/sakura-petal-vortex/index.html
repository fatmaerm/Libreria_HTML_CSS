<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sakura Petal Vortex</title>
<meta name="description" content="Cherry blossom petals tumble in three dimensions across a soft bokeh grove and gather into a swirling vortex around the pointer.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="sakura" id="scene">
  <div class="sakura__sky" aria-hidden="true"></div>
  <div class="sakura__sun" aria-hidden="true"></div>
  <div class="sakura__canopy" aria-hidden="true"></div>
  <div class="sakura__bokeh sakura__bokeh--a" aria-hidden="true"></div>
  <div class="sakura__bokeh sakura__bokeh--b" aria-hidden="true"></div>
  <div class="sakura__bokeh sakura__bokeh--c" aria-hidden="true"></div>
  <div class="sakura__ring" aria-hidden="true"><i></i><i></i></div>
  <div class="sakura__field" id="field" aria-hidden="true"></div>
  <div class="sakura__floor" aria-hidden="true"></div>
  <div class="sakura__vignette" aria-hidden="true"></div>
  <div class="sakura__grain" aria-hidden="true"></div>
  <div class="plate">
    <p class="plate__eyebrow">Hanami Drift</p>
    <h1 class="plate__title">Sakura Petal Vortex</h1>
    <p class="plate__rule"></p>
    <p class="plate__meta">Volumetric petals &middot; bokeh depth &middot; pointer swirl</p>
  </div>
</div>
</body>
</html>
