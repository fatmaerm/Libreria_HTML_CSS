<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Hex Diagnostics Tile</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="hud-tile">
    <div class="tile-corner top-left"></div>
    <div class="tile-corner top-right"></div>
    <div class="tile-corner btm-left"></div>
    <div class="tile-corner btm-right"></div>
    <div class="tile-core">
      <div class="radar-circle">
        <div class="spin-scanner"></div>
      </div>
      <span class="telemetry-val">99.4%</span>
      <span class="telemetry-lbl">ENLACE NEURAL</span>
    </div>
  </div>
</body>
</html>
