<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Glass Prism Split Button</title>
<meta name="description" content="A staggered strip of six glass prism buttons that each split a white beam into a spectrum sweeping across the prism face at cascading offsets.">
<meta name="description-es" content="Una tira escalonada de seis botones de prisma de cristal, cada uno de los cuales divide un haz blanco en un espectro que barre la cara del prisma con desfases encadenados.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="room">
  <div class="haze" aria-hidden="true"></div>
  <div class="wall" aria-hidden="true">
    <span class="wall-seam s1"></span>
    <span class="wall-seam s2"></span>
    <span class="wall-rivet r1"></span>
    <span class="wall-rivet r2"></span>
    <span class="wall-rivet r3"></span>
    <span class="fixture"><span class="fixture-line"></span><span class="fixture-wash"></span></span>
  </div>
  <div class="bench" aria-hidden="true">
    <span class="bench-edge"></span>
    <span class="bench-holes"></span>
    <span class="bench-sheen"></span>
  </div>

  <div class="strip">
    <div class="cell" style="--i:0;--tint:184;--len:66%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Flint prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Flint</b><i>1.620</i></span>
    </div>

    <div class="cell" style="--i:1;--tint:196;--len:72%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Quartz prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Quartz</b><i>1.544</i></span>
    </div>

    <div class="cell" style="--i:2;--tint:206;--len:58%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Fluorite prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Fluorite</b><i>1.434</i></span>
    </div>

    <div class="cell" style="--i:3;--tint:172;--len:64%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Topaz prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Topaz</b><i>1.610</i></span>
    </div>

    <div class="cell" style="--i:4;--tint:158;--len:60%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Beryl prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Beryl</b><i>1.577</i></span>
    </div>

    <div class="cell" style="--i:5;--tint:202;--len:72%">
      <span class="pool" aria-hidden="true"></span>
      <span class="emitter" aria-hidden="true">
        <span class="ebody"></span><span class="eslit"></span>
        <span class="ebeam"></span><span class="pulse"></span>
      </span>
      <button class="prism" type="button" aria-label="Sphene prism button">
        <span class="clip"><span class="tint"></span><span class="glass"></span><span class="sweep"></span><span class="facet"></span><span class="spec"></span></span>
      </button>
      <span class="fan" aria-hidden="true"></span>
      <span class="tag"><b>Sphene</b><i>1.700</i></span>
    </div>
  </div>
</main>
</body>
</html>
