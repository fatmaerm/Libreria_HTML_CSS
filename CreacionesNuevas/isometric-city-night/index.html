<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Isometric City Night</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="city-scene" aria-label="Ciudad isométrica cyberpunk de noche">
    <div class="iso-plane">
      <!-- Rascacielos 1 -->
      <div class="building b1">
        <div class="face roof">
          <div class="antenna">
            <span class="beacon"></span>
          </div>
        </div>
        <div class="face wall-left">
          <div class="windows"></div>
        </div>
        <div class="face wall-right">
          <div class="windows"></div>
        </div>
      </div>
      
      <!-- Rascacielos 2 -->
      <div class="building b2">
        <div class="face roof"></div>
        <div class="face wall-left">
          <div class="windows"></div>
        </div>
        <div class="face wall-right">
          <div class="windows"></div>
        </div>
      </div>

      <!-- Calles luminosas -->
      <div class="street street-h">
        <div class="car-light car-1"></div>
      </div>
      <div class="street street-v">
        <div class="car-light car-2"></div>
      </div>
    </div>
  </div>
</body>
</html>
