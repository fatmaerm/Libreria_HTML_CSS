<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Grid Image Slider</title>
<meta name="description" content="3-column CSS grid-based image reveal slider with staggered entry.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="gslider">
  <div class="gtrack" id="gtrack">
    <div class="gslide"><div class="gcell" style="background:#1e1b4b"><span>🪐</span></div><div class="gcell" style="background:#14532d"><span>🌋</span></div><div class="gcell" style="background:#1c1917"><span>🌲</span></div></div><div class="gslide"><div class="gcell" style="background:#1c3547"><span>🌊</span></div><div class="gcell" style="background:#3b0764"><span>⭐</span></div><div class="gcell" style="background:#1a2035"><span>🔥</span></div></div><div class="gslide"><div class="gcell" style="background:#7f1d1d"><span>🌙</span></div><div class="gcell" style="background:#064e3b"><span>🌿</span></div><div class="gcell" style="background:#1e3a5f"><span>❄️</span></div></div><div class="gslide"><div class="gcell" style="background:#3b1c8c"><span>⚡</span></div><div class="gcell" style="background:#065f46"><span>🎯</span></div><div class="gcell" style="background:#1e1e1e"><span>🌌</span></div></div>
  </div>
  <div class="gcontrols">
    <button id="gprev">‹</button>
    <button class="gdot active" data-i="0"></button><button class="gdot" data-i="1"></button><button class="gdot" data-i="2"></button><button class="gdot" data-i="3"></button>
    <button id="gnext">›</button>
  </div>
</div>
</body>
</html>
