<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSocket Handshake Anim</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ws-scene">
    <div class="endpoint client">
      <span class="icon">💻</span>
      <span class="label">CLIENTE</span>
    </div>
    <div class="wire">
      <div class="packet to-server"></div>
      <div class="packet to-client"></div>
    </div>
    <div class="endpoint server">
      <span class="icon">🖥️</span>
      <span class="label">WS SERVER</span>
    </div>
  </div>
</body>
</html>
