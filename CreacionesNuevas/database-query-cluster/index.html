<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Query Cluster</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="db-scene">
    <div class="db-stack">
      <div class="db-layer layer-1">
        <div class="db-top"></div>
        <div class="pulse-beam beam-1"></div>
      </div>
      <div class="db-layer layer-2">
        <div class="db-top"></div>
        <div class="pulse-beam beam-2"></div>
      </div>
      <div class="db-layer layer-3">
        <div class="db-top"></div>
        <div class="pulse-beam beam-3"></div>
      </div>
    </div>
    <div class="db-status">
      <span class="status-name">POSTGRES // READ CLUSTER</span>
      <span class="status-qps">1,420 QPS</span>
    </div>
  </div>
</body>
</html>
