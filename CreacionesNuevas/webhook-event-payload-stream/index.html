<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webhook Event Payload Stream</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="stream-card">
    <div class="stream-head">
      <span class="live-tag"><span class="dot"></span>WEBHOOK LIVE</span>
      <span class="event-type">payment.succeeded</span>
    </div>
    <div class="stream-code">
      <div class="line"><span class="k">"id"</span>: <span class="s">"evt_3Mvw88"</span>,</div>
      <div class="line"><span class="k">"amount"</span>: <span class="n">4900</span>,</div>
      <div class="line"><span class="k">"currency"</span>: <span class="s">"usd"</span>,</div>
      <div class="line"><span class="k">"status"</span>: <span class="s">"paid"</span></div>
    </div>
    <div class="stream-foot">
      <span class="resp-code">HTTP 200 OK</span>
      <span class="timestamp">hace 2s</span>
    </div>
  </div>
</body>
</html>
