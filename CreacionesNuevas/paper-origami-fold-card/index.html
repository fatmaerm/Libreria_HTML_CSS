<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Origami Fold Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="card-scene">
    <div class="origami-card">
      <div class="card-base">
        <h3>ACCESO CONCEDIDO</h3>
        <p>Cumbre de Diseño 2026</p>
        <span class="card-code">PASS #8849</span>
      </div>
      
      <div class="flap flap-left">
        <div class="flap-face front"></div>
        <div class="flap-face back"></div>
      </div>
      <div class="flap flap-right">
        <div class="flap-face front"></div>
        <div class="flap-face back"></div>
      </div>
    </div>
    <div class="hover-hint">Pasa el cursor para desplegar</div>
  </div>
</body>
</html>
