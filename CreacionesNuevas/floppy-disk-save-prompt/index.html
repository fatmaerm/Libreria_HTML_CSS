<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Floppy Disk Save Prompt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="floppy-card">
    <div class="floppy-shutter">
      <div class="shutter-notch"></div>
    </div>
    <div class="floppy-label">
      <span class="label-title">SOURCE_CODE_V1.DAT</span>
      <span class="label-kb">1.44 MB HD</span>
    </div>
    <div class="save-status">
      <span class="save-led"></span>
      <span class="status-text">GUARDANDO DATOS...</span>
    </div>
  </div>
</body>
</html>
