<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stagger Fade-in Animation</title>
<meta name="description" content="Card grid with staggered CSS fade-in reveal on page load.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="stag-grid">
  <div class="stag-card" style="--d:0s"><div class="stag-icon">⚡</div><p>Item 1</p></div><div class="stag-card" style="--d:0.1s"><div class="stag-icon">🌌</div><p>Item 2</p></div><div class="stag-card" style="--d:0.2s"><div class="stag-icon">🎯</div><p>Item 3</p></div><div class="stag-card" style="--d:0.30000000000000004s"><div class="stag-icon">💡</div><p>Item 4</p></div><div class="stag-card" style="--d:0.4s"><div class="stag-icon">🔥</div><p>Item 5</p></div><div class="stag-card" style="--d:0.5s"><div class="stag-icon">🌊</div><p>Item 6</p></div><div class="stag-card" style="--d:0.6000000000000001s"><div class="stag-icon">🪐</div><p>Item 7</p></div><div class="stag-card" style="--d:0.7000000000000001s"><div class="stag-icon">💎</div><p>Item 8</p></div><div class="stag-card" style="--d:0.8s"><div class="stag-icon">🎨</div><p>Item 9</p></div>
</div>
</body>
</html>
