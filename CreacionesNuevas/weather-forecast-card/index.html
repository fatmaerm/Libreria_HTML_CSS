<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Weather Forecast Card</title>
<meta name="description" content="Beautiful animated weather card with temperature and forecast strip.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="weather-card">
  <div class="weather-main">
    <div class="weather-icon">⛅</div>
    <div class="temp">18°</div>
    <div class="condition">Partly Cloudy</div>
    <div class="location">📍 Madrid, ES</div>
  </div>
  <div class="forecast">
    <div class="day"><span>Mon</span><span>☀️</span><span>22°</span></div><div class="day"><span>Tue</span><span>⛅</span><span>18°</span></div><div class="day"><span>Wed</span><span>🌧️</span><span>15°</span></div><div class="day"><span>Thu</span><span>⛅</span><span>17°</span></div><div class="day"><span>Fri</span><span>☀️</span><span>24°</span></div>
  </div>
</div>
</body>
</html>
