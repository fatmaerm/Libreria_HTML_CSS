<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keyboard Shortcut Display</title>
<meta name="description" content="Interactive keyboard shortcut reference card with key press highlight.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="kb-wrap">
  <h2>Keyboard Shortcuts</h2>
  <div class="shortcuts">
    <div class="shortcut"><div class="keys"><kbd>⌘</kbd><span>+</span><kbd>K</kbd></div><span class="desc">Command palette</span></div><div class="shortcut"><div class="keys"><kbd>⌘</kbd><span>+</span><kbd>P</kbd></div><span class="desc">Quick open</span></div><div class="shortcut"><div class="keys"><kbd>⌘</kbd><span>+</span><kbd>⇧</kbd><span>+</span><kbd>P</kbd></div><span class="desc">Run command</span></div><div class="shortcut"><div class="keys"><kbd>⌘</kbd><span>+</span><kbd>B</kbd></div><span class="desc">Toggle sidebar</span></div><div class="shortcut"><div class="keys"><kbd>⌘</kbd><span>+</span><kbd>/</kbd></div><span class="desc">Toggle comment</span></div>
  </div>
  <p class="hint" id="kbHint">Press any key to highlight</p>
</div>
</body>
</html>
