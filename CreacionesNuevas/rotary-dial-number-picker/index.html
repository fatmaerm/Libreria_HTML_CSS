<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rotary Dial Number Picker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="rotary-card">
    <div class="number-display" id="numDisplay">NÚMERO: 5</div>
    <div class="dial-wheel" id="dialWheel">
      <div class="hole" data-num="1" style="top:15px; left:95px">1</div>
      <div class="hole" data-num="2" style="top:35px; right:40px">2</div>
      <div class="hole" data-num="3" style="top:90px; right:20px">3</div>
      <div class="hole" data-num="4" style="bottom:45px; right:40px">4</div>
      <div class="hole" data-num="5" style="bottom:15px; left:95px">5</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
