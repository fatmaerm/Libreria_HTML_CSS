<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tornado Vortex Debris</title>
<meta name="description" content="A leaning storm funnel sweeps dust, grit and torn debris along spiralling paths while lightning flickers inside the column.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="storm">
  <div class="storm__sky" aria-hidden="true"></div>
  <div class="storm__shelf storm__shelf--a" aria-hidden="true"></div>
  <div class="storm__shelf storm__shelf--b" aria-hidden="true"></div>
  <div class="storm__shelf storm__shelf--c" aria-hidden="true"></div>
  <div class="storm__rain storm__rain--back" aria-hidden="true"><i></i></div>
  <canvas class="storm__fx" id="fx" aria-hidden="true"></canvas>
  <div class="storm__flash" id="flash" aria-hidden="true"></div>
  <div class="storm__ground" aria-hidden="true"></div>
  <div class="storm__rain storm__rain--front" aria-hidden="true"><i></i></div>
  <div class="storm__vignette" aria-hidden="true"></div>
  <div class="storm__grain" aria-hidden="true"></div>
  <div class="plate">
    <p class="plate__eyebrow">Supercell Tracking</p>
    <h1 class="plate__title">Tornado Vortex Debris</h1>
    <p class="plate__rule"></p>
    <p class="plate__meta">Funnel spiral &middot; depth-sorted debris &middot; inner lightning</p>
  </div>
</div>
</body>
</html>
