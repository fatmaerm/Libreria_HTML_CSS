<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stained Glass Light Shaft</title>
<meta name="description" content="A leaded gothic window of jewel-toned glass throws animated god rays across a dark stone nave while dust motes drift through the light.">
<meta name="description-es" content="Una vidriera gótica de vidrios preciosos y plomos lanza rayos de luz animados por una nave de piedra oscura, mientras motas de polvo flotan en el haz.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>

<div class="nave" aria-hidden="true">
  <div class="nave__stone"></div>
  <div class="nave__moon"></div>
  <div class="nave__haze"></div>
  <div class="nave__floor"></div>
  <div class="nave__rail"></div>
</div>

<main class="stage">

    <div class="window-frame" aria-hidden="true"></div>

        <path id="archShape" d="M 52 434 L 52 216 C 52 120 122 62 200 32 C 278 62 348 120 348 216 L 348 434 Z"/>
        <clipPath id="archClip">
          <use href="#archShape"/>
        </clipPath>
        <radialGradient id="sunGlow" cx="50%" cy="38%" r="62%">
          <stop offset="0" stop-color="#fff3c8" stop-opacity=".95"/>
          <stop offset=".42" stop-color="#ffcf72" stop-opacity=".55"/>
          <stop offset="1" stop-color="#e0761f" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="glint" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff6dd" stop-opacity="0"/>
          <stop offset=".5" stop-color="#fff6dd" stop-opacity=".5"/>
          <stop offset="1" stop-color="#fff6dd" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="stoneGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6d6559"/>
          <stop offset=".5" stop-color="#4a453c"/>
          <stop offset="1" stop-color="#2c2823"/>
        </linearGradient>
        <pattern id="quarry" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="24" height="24" fill="#3b2a15"/>
          <path d="M 0 12 H 24 M 12 0 V 24" stroke="#c9902f" stroke-width="8" stroke-opacity=".8"/>
          <path d="M 0 12 H 24 M 12 0 V 24" stroke="#150f0a" stroke-width="2.2"/>
        </pattern>
        <pattern id="came" width="30" height="30" patternUnits="userSpaceOnUse">
          <rect width="30" height="30" fill="#1d1610"/>
          <path d="M 0 0 H 30 M 0 0 V 30" stroke="#0e0a07" stroke-width="2.4"/>
        </pattern>
        <pattern id="flaws" width="10" height="10" patternUnits="userSpaceOnUse">
          <path d="M 0 3 H 10 M 0 7.4 H 10" stroke="#ffe9b8" stroke-width=".7" stroke-opacity=".16"/>
        </pattern>
      </defs>

      <use href="#archShape" fill="none" stroke="url(#stoneGrad)" stroke-width="30" stroke-linejoin="round"/>
      <use href="#archShape" fill="none" stroke="#211d18" stroke-width="34" stroke-opacity=".55" stroke-linejoin="round"/>

      <g clip-path="url(#archClip)">
        <rect x="40" y="20" width="320" height="426" fill="url(#came)"/>

        <g class="glass">
          <rect x="40" y="20" width="320" height="426" fill="url(#quarry)"/>

          <g class="rose">
            <circle cx="200" cy="172" r="94" fill="#1b2f4a" stroke="#120d09" stroke-width="4"/>

            <circle cx="200" cy="172" r="19" fill="#f2cd74" stroke="#120d09" stroke-width="3.4"/>
            <circle cx="200" cy="172" r="8" fill="#fff3cf" stroke="#120d09" stroke-width="2"/>
            <circle cx="200" cy="172" r="62" fill="none" stroke="#e8c684" stroke-width="4" stroke-opacity=".55"/>
          </g>

          <g stroke="#120d09" stroke-width="3.4" stroke-linejoin="round">
            <rect x="66" y="272" width="84" height="36" fill="#a2243c"/>

            <rect x="250" y="352" width="84" height="36" fill="#d9962a"/>
            <rect x="250" y="392" width="84" height="36" fill="#1d4d8c"/>
          </g>

          <path d="M 150 268 L 150 432 M 242 268 L 242 432" stroke="#120d09" stroke-width="5"/>
          <rect x="40" y="20" width="320" height="426" fill="url(#flaws)"/>
        </g>

        <circle class="sun" cx="200" cy="172" r="120" fill="url(#sunGlow)"/>
        <g class="glint"><rect x="-120" y="0" width="120" height="460" fill="url(#glint)"/></g>
      </g>

      <use href="#archShape" fill="none" stroke="url(#quarry)" stroke-width="16"/>
      <use href="#archShape" fill="none" stroke="#0f0b08" stroke-width="18" stroke-opacity=".7" stroke-linejoin="round"/>
      <use href="#archShape" fill="none" stroke="url(#stoneGrad)" stroke-width="6" stroke-opacity=".9" stroke-linejoin="round"/>
      <path d="M 84 300 L 84 424 M 316 300 L 316 424" stroke="#0f0b08" stroke-width="4"/>
    </svg>
  </div>

    <div class="shaft" style="--a:7deg;--w:8vmax;--o:.24;--t:17s;--d:-5s"></div>

  <header class="hud hud--tl">
    <p class="eyebrow">Nave Study Number Three</p>
    <h1 class="title">Stained Glass Light Shaft</h1>
    <p class="lede">Late afternoon sun through leaded quarries</p>
