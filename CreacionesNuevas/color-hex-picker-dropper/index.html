<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Hex Picker Dropper</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="picker-card">
    <div class="color-preview" id="colorPreview"></div>
    <div class="picker-controls">
      <div class="hex-info">
        <span class="label">COLOR ACTIVO</span>
        <span class="hex-code" id="hexCode">#6366F1</span>
      </div>
      <div class="swatches">
        <button class="swatch" style="background:#6366f1" data-hex="#6366F1"></button>
        <button class="swatch" style="background:#ec4899" data-hex="#EC4899"></button>
        <button class="swatch" style="background:#06b6d4" data-hex="#06B6D4"></button>
        <button class="swatch" style="background:#10b981" data-hex="#10B981"></button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
