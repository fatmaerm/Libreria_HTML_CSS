<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPM Package Stat Card</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="npm-card">
    <div class="card-head">
      <div class="pkg-title">
        <span class="npm-logo">npm</span>
        <h3>@kindred/ui-motion</h3>
      </div>
      <span class="ver-badge">v1.4.2</span>
    </div>
    <p class="pkg-desc">Librería de microanimaciones y efectos UI modernos en CSS y JS vanilla.</p>
    <div class="card-stats">
      <div class="stat"><span class="val">142K/mes</span><span class="lbl">DESCARGAS</span></div>
      <div class="stat"><span class="val">3.4 kB</span><span class="lbl">MIN + GZIP</span></div>
      <div class="stat"><span class="val">MIT</span><span class="lbl">LICENCIA</span></div>
    </div>
  </div>
</body>
</html>
