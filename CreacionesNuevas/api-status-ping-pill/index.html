<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Status Ping Pill</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="status-stack">
    <div class="status-pill pill-prod">
      <span class="ping-circle"><span class="ping-wave"></span></span>
      <span class="cluster-name">API PRODUCTION // EU-WEST</span>
      <span class="ping-ms">18ms</span>
      <span class="status-label">100% OPERACIONAL</span>
    </div>
    <div class="status-pill pill-staging">
      <span class="ping-circle"><span class="ping-wave"></span></span>
      <span class="cluster-name">STAGING // US-EAST</span>
      <span class="ping-ms">42ms</span>
      <span class="status-label">99.8% ESTABLE</span>
    </div>
  </div>
</body>
</html>
