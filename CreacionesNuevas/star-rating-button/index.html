<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Rating Button</title>
<meta name="description" content="Interactive animated star rating button component.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="rating" id="rating" aria-label="Star rating">
  <button class="star" data-v="1" aria-label="1 star">★</button><button class="star" data-v="2" aria-label="2 star">★</button><button class="star" data-v="3" aria-label="3 star">★</button><button class="star" data-v="4" aria-label="4 star">★</button><button class="star" data-v="5" aria-label="5 star">★</button>
</div>
<p class="hint" id="hint">Select a rating</p>
</body>
</html>
