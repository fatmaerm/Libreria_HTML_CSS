<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iridescent Thin Film Button</title>
<meta name="description" content="A single button whose surface is a soap-thin film with continuously crawling interference colour, a visible meniscus edge and a faint rainbow rim.">
<meta name="description-es" content="Un botón cuya superficie es una película tan fina como una pompa de jabón, con colores de interferencia que reptan sin parar, un borde de menisco bien visible y un tenue ribete de arcoíris.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="solo">
  <div class="halo" aria-hidden="true"></div>
  <div class="shadow" aria-hidden="true"></div>

  <div class="bubble">
    <span class="rim" aria-hidden="true"></span>
    <button class="film" type="button">
      <span class="l1" aria-hidden="true"></span>
      <span class="l2" aria-hidden="true"></span>
      <span class="l3" aria-hidden="true"></span>
      <span class="l5" aria-hidden="true"></span>
      <span class="l4" aria-hidden="true"></span>
      <span class="sheen" aria-hidden="true"></span>
      <span class="bead" aria-hidden="true"></span>
      <span class="meniscus" aria-hidden="true"></span>
      <span class="pop" aria-hidden="true"></span>
      <span class="label">
        <b>Thin Film</b>
        <i>380&ndash;780 nm</i>
      </span>
    </button>
  </div>
</main>
</body>
</html>
