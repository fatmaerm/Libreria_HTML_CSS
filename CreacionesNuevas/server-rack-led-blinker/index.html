<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Rack LED Blinker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="rack-cabinet" aria-label="Gabinete de servidores con LEDs">
    <div class="blade blade-1">
      <div class="blade-handle"></div><span class="blade-tag">NODE 01</span>
      <div class="led-array"><span class="led led-green l1"></span><span class="led led-green l2"></span><span class="led led-blue l3"></span><span class="led led-amber l4"></span></div>
    </div>
    <div class="blade blade-2">
      <div class="blade-handle"></div><span class="blade-tag">NODE 02</span>
      <div class="led-array"><span class="led led-green l5"></span><span class="led led-blue l6"></span><span class="led led-green l7"></span><span class="led led-green l8"></span></div>
    </div>
    <div class="blade blade-3">
      <div class="blade-handle"></div><span class="blade-tag">NODE 03</span>
      <div class="led-array"><span class="led led-blue l9"></span><span class="led led-green l10"></span><span class="led led-amber l11"></span><span class="led led-green l12"></span></div>
    </div>
  </div>
</body>
</html>
