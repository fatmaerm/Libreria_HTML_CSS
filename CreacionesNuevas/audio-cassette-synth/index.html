<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Cassette Synth</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="cassette-container" aria-label="Cassette de música synthwave retro">
    <div class="cassette-body">
      <div class="screw top-left"></div>
      <div class="screw top-right"></div>
      <div class="screw bottom-left"></div>
      <div class="screw bottom-right"></div>
      
      <div class="cassette-label">
        <div class="synth-stripes">
          <span></span><span></span><span></span>
        </div>
        <div class="label-header">
          <span class="side-tag">LADO A</span>
          <span class="album-title">SYNTHWAVE DREAMS 1984</span>
          <span class="eq-tag">CHROME EQ</span>
        </div>
        
        <div class="tape-window">
          <div class="tape-spool left-spool">
            <div class="spool-center">
              <span class="spool-teeth"></span>
            </div>
            <div class="spool-wound wound-left"></div>
          </div>
          
          <div class="tape-bridge">
            <div class="tape-line"></div>
          </div>
          
          <div class="tape-spool right-spool">
            <div class="spool-center">
              <span class="spool-teeth"></span>
            </div>
            <div class="spool-wound wound-right"></div>
          </div>
        </div>
      </div>
      
      <div class="cassette-bottom">
        <div class="guide-hole left-hole"></div>
        <div class="tape-head-window"></div>
        <div class="guide-hole right-hole"></div>
      </div>
    </div>
  </div>
</body>
</html>
