<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Color Swatch Toggle</title>
<meta name="description" content="Color theme swatch picker with animated selection ring.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>
<div class="picker">
  <h3>Choose Theme</h3>
  <div class="swatches" id="swatches">
    <button class="swatch active" style="--c:#6366f1" data-color="#6366f1"></button><button class="swatch" style="--c:#10b981" data-color="#10b981"></button><button class="swatch" style="--c:#f59e0b" data-color="#f59e0b"></button><button class="swatch" style="--c:#ef4444" data-color="#ef4444"></button><button class="swatch" style="--c:#06b6d4" data-color="#06b6d4"></button><button class="swatch" style="--c:#a855f7" data-color="#a855f7"></button><button class="swatch" style="--c:#ec4899" data-color="#ec4899"></button><button class="swatch" style="--c:#84cc16" data-color="#84cc16"></button>
  </div>
  <div class="preview" id="preview">Selected: #6366f1</div>
</div>
</body>
</html>
