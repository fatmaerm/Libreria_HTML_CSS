<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Watercolor Bleed Bloom</title>
<meta name="description" content="Pigment washes bloom and bleed across cotton rag paper through SVG turbulence, displacement and blur filters in a staggered seamless loop.">
<link rel="stylesheet" href="styles.css">
<script defer src="script.js"></script>
</head>
<body>

<svg class="defs" aria-hidden="true" focusable="false">
  <defs>
    <filter id="wcBleed" x="-45%" y="-45%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.011 0.014" numOctaves="2" seed="17" result="turb"/>
      <feDisplacementMap in="SourceGraphic" in2="turb" scale="58" xChannelSelector="R" yChannelSelector="G" result="disp"/>
      <feGaussianBlur in="disp" stdDeviation="3.6" result="soft"/>
      <feColorMatrix in="soft" type="matrix" values="1.12 0 0 0 -0.03  0 1.04 0 0 0.01  0 0 0.96 0 0.02  0 0 0 1.2 0" result="wet"/>
      <feBlend in="wet" in2="disp" mode="multiply"/>
    </filter>
    <filter id="wcLobe" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.021" numOctaves="3" seed="5" result="t"/>
      <feDisplacementMap in="SourceGraphic" in2="t" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="wcFibre" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.78" numOctaves="2" seed="23" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5" intercept="0"/>
      </feComponentTransfer>
    </filter>
    <filter id="wcMottle" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.018" numOctaves="2" seed="41" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.28  0 0 0 0 0.2  0 0 0 0.62 0"/>
    </filter>
    <filter id="wcGrain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="61" stitchTiles="stitch" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.4" intercept="0"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>

<div class="grain" aria-hidden="true">
  <svg><rect width="100%" height="100%" filter="url(#wcGrain)"/></svg>
</div>

<main class="stage">

  <section class="sheet" aria-label="Watercolor blooms on cotton rag paper">
    <div class="paper" aria-hidden="true"></div>
    <div class="laid" aria-hidden="true"></div>

    <div class="bloom-field" id="bloomField">
      <div class="bloom" style="--x:20%;--y:27%;--size:37%;--c1:rgba(186,97,58,.95);--c2:rgba(150,71,50,0);--c3:rgba(214,140,96,.9);--c4:rgba(214,140,96,0);--dur:19s;--delay:-2.4s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:52%;--y:21%;--size:27%;--c1:rgba(74,94,148,.88);--c2:rgba(52,68,112,0);--c3:rgba(126,146,196,.85);--c4:rgba(126,146,196,0);--dur:24s;--delay:-9.1s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:73%;--y:46%;--size:31%;--c1:rgba(199,147,58,.92);--c2:rgba(160,113,36,0);--c3:rgba(226,186,112,.85);--c4:rgba(226,186,112,0);--dur:21s;--delay:-14.6s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:37%;--y:64%;--size:25%;--c1:rgba(172,74,68,.9);--c2:rgba(131,50,50,0);--c3:rgba(214,132,124,.85);--c4:rgba(214,132,124,0);--dur:26s;--delay:-5.3s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:61%;--y:78%;--size:21%;--c1:rgba(114,138,98,.9);--c2:rgba(84,106,71,0);--c3:rgba(160,182,138,.85);--c4:rgba(160,182,138,0);--dur:17.5s;--delay:-11.8s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:13%;--y:72%;--size:17%;--c1:rgba(60,74,110,.82);--c2:rgba(41,52,80,0);--c3:rgba(112,132,178,.8);--c4:rgba(112,132,178,0);--dur:29s;--delay:-19.2s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:44%;--y:41%;--size:14%;--c1:rgba(196,110,66,.85);--c2:rgba(154,78,46,0);--c3:rgba(224,164,124,.8);--c4:rgba(224,164,124,0);--dur:31s;--delay:-23.4s"><span class="bloom-form"></span></div>
      <div class="bloom" style="--x:83%;--y:24%;--size:13%;--c1:rgba(146,96,140,.82);--c2:rgba(108,66,108,0);--c3:rgba(190,152,186,.8);--c4:rgba(190,152,186,0);--dur:33s;--delay:-27.7s"><span class="bloom-form"></span></div>
    </div>

    <div class="mottle" aria-hidden="true">
      <svg><rect width="100%" height="100%" filter="url(#wcMottle)"/></svg>
    </div>
    <div class="fibre" aria-hidden="true">
      <svg><rect width="100%" height="100%" filter="url(#wcFibre)"/></svg>
    </div>
    <div class="glaze" aria-hidden="true"></div>
    <div class="edge" aria-hidden="true"></div>
  </section>

  <header class="hud hud--tl">
    <p class="eyebrow">Pigment Study Number Four</p>
    <h1 class="title">Watercolor Bleed Bloom</h1>
    <p class="lede">Cold-press pigment soaking into 300&nbsp;gsm cotton rag</p>
  </header>

  <footer class="hud hud--br">
    <ul class="spec">
      <li>feTurbulence fractalNoise 0.011</li>
      <li>feDisplacementMap scale 58</li>
      <li>feGaussianBlur 3.6</li>
      <li>wet edge multiply accumulation</li>
    </ul>
  </footer>

  <p class="hint hud--bl">Press and drag on the sheet to wet the paper</p>

</main>

</body>
</html>
